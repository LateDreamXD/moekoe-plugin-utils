name: test

on:
  push:
    branches: [main]
    paths: ['packages/utils']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 22
      - name: install deps
        run: pnpm ci
      - name: build
        run: pnpm run -C packages/utils build
      - name: test
        run: pnpm run -C packages/utils test
